<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중국어 단어장</title>
  <style>
    :root {
      --bg: #fdf6ec;
      --card: #ffffff;
      --red: #c0392b;
      --red-dark: #962d22;
      --gold: #f4b942;
      --text: #2b2b2b;
      --muted: #8a8076;
      --line: #eadfcf;
      --good: #2e9e5b;
      --bad: #d64545;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; border: none; }
    input { font-family: inherit; }

    /* 상단 바 */
    header {
      max-width: 520px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 12px 12px 4px; gap: 6px;
    }
    header .mid { text-align: center; }
    header h1 { font-size: 1.2rem; color: var(--red); white-space: nowrap; }
    header p { font-size: .75rem; color: var(--muted); margin-top: 2px; white-space: nowrap; }
    .top-btn {
      background: #fff; border: 1px solid var(--line); color: var(--red);
      border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 800;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .top-btn.left { justify-self: start; }
    .top-btn.right { justify-self: end; background: var(--red); color: #fff; border-color: var(--red); }
    main { max-width: 520px; margin: 0 auto; padding: 8px 16px 110px; }
    .view { display: none; }
    .view.active { display: block; }

    /* 하단 메뉴 */
    nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #fff; border-top: 1px solid var(--line);
      display: flex; justify-content: center;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      gap: 5px; z-index: 10;
    }
    nav button {
      flex: 1; max-width: 100px; min-width: 0;
      background: #f6ede0; color: var(--muted);
      border-radius: 12px; padding: 8px 2px;
      font-size: .72rem; font-weight: 800; white-space: nowrap;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    nav button .ico { font-size: 1.2rem; }
    nav button.active { background: var(--red); color: #fff; }

    /* 공통 */
    .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 8px 0 12px; }
    .chip {
      background: #fff; border: 1px solid var(--line); color: var(--muted);
      border-radius: 999px; padding: 6px 14px; font-size: .85rem; font-weight: 700;
    }
    .chip.on { background: var(--gold); border-color: var(--gold); color: #3b2a00; }
    .counter { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
    .btn {
      background: var(--red); color: #fff; font-weight: 700;
      border-radius: 12px; padding: 12px 18px; font-size: 1rem;
    }
    .btn:active { background: var(--red-dark); }
    .btn.ghost { background: #fff; color: var(--red); border: 2px solid var(--red); }
    .btn.gold { background: var(--gold); color: #3b2a00; }
    .btn.full { width: 100%; }
    .btn:disabled { background: #d9d0c3; color: #fff; cursor: not-allowed; }
    .btn.small { padding: 7px 12px; font-size: .85rem; border-radius: 10px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row .btn { flex: 1; padding: 12px 6px; }
    .speak {
      background: #f6ede0; color: var(--red); border-radius: 999px;
      padding: 6px 12px; font-size: .85rem; font-weight: 700;
    }
    .vtitle { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 10px; }
    .vtitle h2 { font-size: 1.15rem; }
    .vtitle span { color: var(--muted); font-size: .9rem; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; line-height: 1.7; }
    .empty .big { font-size: 3rem; }
    .empty .btn { margin-top: 14px; }

    /* 플래시카드 */
    .scene { perspective: 1200px; }
    .card {
      position: relative; width: 100%; height: 400px;
      transition: transform .5s; transform-style: preserve-3d; cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: var(--card); border-radius: 22px;
      box-shadow: 0 6px 22px rgba(120, 70, 20, .13);
      border: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; overflow: auto;
    }
    .face.back { transform: rotateY(180deg); justify-content: flex-start; padding-top: 28px; }
    .lvtag {
      position: absolute; top: 12px; left: 14px;
      background: #f6ede0; color: var(--red); font-size: .75rem; font-weight: 800;
      padding: 3px 10px; border-radius: 999px;
    }
    .badge-mine { position: absolute; top: 10px; right: 14px; font-size: 1.2rem; }
    .hanzi {
      font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Malgun Gothic", sans-serif;
      font-size: clamp(3.5rem, 22vw, 6.5rem); line-height: 1.15; font-weight: 700; color: var(--red);
      word-break: keep-all;
    }
    .hanzi.long { font-size: clamp(2.4rem, 14vw, 4rem); }
    .hint { color: var(--muted); font-size: .85rem; margin-top: 18px; }
    .ko { font-size: 1.7rem; font-weight: 800; line-height: 1.35; margin-top: 4px; }
    .ko.long { font-size: 1.2rem; }
    .py { color: var(--muted); font-size: 1.05rem; margin-top: 6px; }
    .divider { width: 70%; height: 1px; background: var(--line); margin: 16px 0 12px; }
    .ex-zh {
      font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 1.25rem; font-weight: 600;
    }
    .ex-ko { color: var(--muted); margin: 4px 0 10px; font-size: .95rem; }

    /* 내 단어장 */
    .item {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; margin-bottom: 8px;
    }
    .item .top { display: flex; align-items: center; gap: 10px; }
    .item .h { font-size: 1.6rem; font-weight: 700; color: var(--red); min-width: 70px; font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .item .m { flex: 1; min-width: 0; }
    .item .m .p { color: var(--muted); font-size: .85rem; }
    .item .m .k { font-weight: 700; font-size: .95rem; }
    .item .ex { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .9rem; }
    .item .ex small { color: var(--muted); display: block; }
    .icon-btn { background: #f6ede0; border-radius: 10px; padding: 7px 9px; font-size: 1rem; }
    .icon-btn.del { color: var(--bad); }

    /* 퀴즈 */
    .panel {
      background: #fff; border: 1px solid var(--line); border-radius: 22px;
      padding: 24px 18px; text-align: center;
      box-shadow: 0 6px 22px rgba(120, 70, 20, .08);
    }
    .panel h2 { color: var(--red); margin-bottom: 8px; }
    .panel p { color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
    .lockmsg {
      background: #fff3e0; border: 2px dashed var(--gold); color: #8a5a00;
      border-radius: 14px; padding: 14px; font-weight: 800; line-height: 1.5; margin-bottom: 12px;
    }
    .stats { display: flex; gap: 10px; margin: 14px 0 18px; }
    .stat { flex: 1; background: #fdf6ec; border-radius: 14px; padding: 12px 6px; }
    .stat b { display: block; font-size: 1.5rem; color: var(--red); }
    .stat span { font-size: .8rem; color: var(--muted); }
    .progress { height: 8px; background: #f1e6d4; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .progress div { height: 100%; background: var(--gold); width: 0; transition: width .3s; }
    .qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 4px; }
    .qword { margin: 10px 0 4px; }
    .choices { display: grid; gap: 8px; margin-top: 16px; }
    .choice {
      background: #fff; border: 2px solid var(--line); border-radius: 14px;
      padding: 14px 12px; font-size: 1rem; font-weight: 700; color: var(--text);
      text-align: center; transition: .15s;
    }
    .choice:active { transform: scale(.98); }
    .choice.right { background: #e6f6ec; border-color: var(--good); color: var(--good); }
    .choice.wrong { background: #fde9e9; border-color: var(--bad); color: var(--bad); }
    .choice:disabled { cursor: default; }
    .feedback { min-height: 28px; margin-top: 12px; font-weight: 800; }
    .feedback.ok { color: var(--good); }
    .feedback.no { color: var(--bad); }
    .score-big { font-size: 4rem; font-weight: 900; color: var(--red); line-height: 1.1; }
    .score-big small { font-size: 1.3rem; }
    .wrongs { text-align: left; margin: 14px 0; }
    .wrongs h3 { font-size: .95rem; margin-bottom: 6px; }
    .wrongs div { font-size: .9rem; padding: 6px 10px; background: #fdf6ec; border-radius: 10px; margin-bottom: 4px; }

    /* 아바타 */
    .avatar {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18);
      line-height: 1; vertical-align: middle;
    }
    .avatar .acc { position: absolute; left: 50%; transform: translateX(-50%); line-height: 1; }
    .avatar .acc.top { top: -14%; }
    .avatar .acc.eyes { top: 28%; font-size: 1.15em; }

    /* 사람 목록 (친구, 검색 결과, 리그) */
    .person {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .person .who { flex: 1; min-width: 0; }
    .person .who b { display: block; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; }
    .person .who small { color: var(--muted); font-size: .8rem; }
    .person.me { border-color: var(--gold); background: #fff8e6; }
    .rank { width: 34px; text-align: center; font-weight: 900; font-size: 1.1rem; color: var(--muted); }
    .pts { text-align: right; font-weight: 900; color: var(--red); font-size: 1.15rem; line-height: 1.1; }
    .pts small { display: block; font-weight: 600; color: var(--muted); font-size: .72rem; }
    .searchbar { display: flex; gap: 8px; margin: 6px 0 14px; }
    .searchbar input {
      flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 12px;
      padding: 11px 12px; font-size: 1rem; background: #fff;
    }
    .searchbar input:focus, .field input:focus { outline: none; border-color: var(--red); }

    /* 모달 */
    .modal {
      position: fixed; inset: 0; background: rgba(40, 25, 10, .45);
      display: none; align-items: flex-end; justify-content: center; z-index: 30;
    }
    .modal.open { display: flex; }
    .sheet {
      position: relative; background: var(--bg); width: 100%; max-width: 520px;
      max-height: 88vh; overflow-y: auto; border-radius: 24px 24px 0 0;
      padding: 22px 18px 26px;
    }
    .sheet h2 { color: var(--red); font-size: 1.25rem; margin-bottom: 14px; }
    .sheet .x {
      position: absolute; top: 12px; right: 14px; background: #fff; border: 1px solid var(--line);
      border-radius: 50%; width: 32px; height: 32px; font-size: 1rem; color: var(--muted);
    }
    .field { display: block; margin-bottom: 12px; font-weight: 800; font-size: .9rem; }
    .field input {
      display: block; width: 100%; margin-top: 5px;
      border: 2px solid var(--line); border-radius: 12px; padding: 12px; font-size: 1rem; background: #fff;
    }
    .pwwrap { position: relative; margin-top: 5px; }
    .pwwrap input { margin-top: 0; padding-right: 92px; }
    .pwtoggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: #f6ede0; color: var(--red); border-radius: 8px;
      padding: 6px 9px; font-size: .78rem; font-weight: 800; white-space: nowrap;
    }
    .field small { display: block; font-weight: 500; color: var(--muted); margin-top: 3px; }
    .note { margin-top: 12px; font-size: .8rem; color: var(--muted); line-height: 1.5; text-align: center; }
    .err { color: var(--bad); font-weight: 800; min-height: 22px; margin-bottom: 6px; font-size: .9rem; }
    .switch { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: .9rem; }
    .switch .btn { margin-top: 8px; }
    .me-card { display: flex; align-items: center; gap: 12px; background: #fff8e6; border: 1px solid var(--gold); border-radius: 16px; padding: 12px; margin-bottom: 14px; }
    .me-card b { font-size: 1.1rem; display: block; }
    .me-card small { color: var(--muted); }
    .fab-row { position: sticky; bottom: -26px; display: flex; justify-content: flex-end; padding: 12px 0 0; background: linear-gradient(to top, var(--bg) 70%, transparent); }
    .avatar-preview { text-align: center; margin: 4px 0 14px; }
    .opt-title { font-weight: 800; font-size: .9rem; margin: 12px 0 6px; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .grid button {
      width: 46px; height: 56px; border-radius: 12px; background: #fff; border: 2px solid var(--line);
      font-size: 1.5rem; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    }
    .grid button .lk { font-size: .62rem; font-weight: 800; color: var(--muted); min-height: .7rem; line-height: .7rem; }
    .grid button.locked { background: #f1ebe2; border-style: dashed; }
    .grid button.locked > span:first-child { filter: grayscale(1); opacity: .45; }
    .grid button.sw { height: 44px; width: 44px; }
    .unlock-info { text-align: center; background: #fff8e6; border: 1px solid var(--gold); border-radius: 12px; padding: 9px 10px; font-size: .85rem; color: #6b4a00; margin-bottom: 4px; line-height: 1.5; }
    .grid button.on { border-color: var(--red); background: #fff0ee; }
    .grid button.sw { border-radius: 50%; }
    .grid button.none { font-size: .75rem; font-weight: 800; color: var(--muted); }

    .toast {
      position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
      background: #333; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: .9rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 40;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <button class="top-btn left" id="profileBtn"></button>
    <div class="mid">
      <h1>汉语 중국어 단어장</h1>
      <p id="sub"></p>
    </div>
    <button class="top-btn right" id="authBtn">로그인</button>
  </header>

  <main>
    <!-- 1. 플래시카드 -->
    <section id="view-cards" class="view active">
      <div class="chips" id="levelChips"></div>
      <div class="counter" id="counter"></div>
      <div class="scene">
        <div class="card" id="card">
          <div class="face front">
            <span class="lvtag" id="lvTagF"></span>
            <span class="badge-mine" id="mineF"></span>
            <div class="hanzi" id="hanzi"></div>
            <div class="hint">카드를 눌러서 뜻 보기 👆</div>
          </div>
          <div class="face back">
            <span class="lvtag" id="lvTagB"></span>
            <span class="badge-mine" id="mineB"></span>
            <div class="ko" id="ko"></div>
            <div class="py" id="py"></div>
            <div class="divider"></div>
            <div class="ex-zh" id="exZh"></div>
            <div class="ex-ko" id="exKo"></div>
            <button class="speak" id="speakEx">🔊 예문 듣기</button>
          </div>
        </div>
      </div>
      <div class="row">
        <button class="btn ghost" id="prev">◀ 이전</button>
        <button class="btn ghost" id="speakWord">🔊 발음</button>
        <button class="btn ghost" id="next">다음 ▶</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="shuffle">🔀 섞기</button>
        <button class="btn" id="addMine" style="flex:2">⭐ 내 단어장에 추가</button>
      </div>
    </section>

    <!-- 2. 내 단어장 -->
    <section id="view-mine" class="view">
      <div class="vtitle"><h2>⭐ 내 단어장</h2><span id="mineCount"></span></div>
      <div id="mineList"></div>
    </section>

    <!-- 3. 퀴즈 -->
    <section id="view-quiz" class="view"><div id="quizBox"></div></section>

    <!-- 4. 친구 추가 -->
    <section id="view-add" class="view">
      <div class="vtitle"><h2>➕ 친구 추가</h2></div>
      <div id="addBox"></div>
    </section>

    <!-- 5. 친구 리그 -->
    <section id="view-league" class="view">
      <div class="vtitle"><h2>🏆 친구 리그</h2></div>
      <div id="leagueBox"></div>
    </section>
  </main>

  <nav>
    <button data-view="cards" class="active"><span class="ico">🃏</span>플래시카드</button>
    <button data-view="mine"><span class="ico">⭐</span>내 단어장</button>
    <button data-view="quiz"><span class="ico">📝</span>퀴즈</button>
    <button data-view="add"><span class="ico">➕</span>친구 추가</button>
    <button data-view="league"><span class="ico">🏆</span>친구 리그</button>
  </nav>

  <div class="modal" id="modal"><div class="sheet"><button class="x" id="modalX" aria-label="닫기">✕</button><div id="modalBody"></div></div></div>
  <div class="toast" id="toast"></div>

  <script src="words1.js"></script>
  <script src="words2.js"></script>
  <script src="words3.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    };
    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));

    /* ================= 데이터: 계정 / 게스트 =================
       ⚠ 서버가 없어서 모든 계정은 '이 브라우저 안'에만 저장돼요. */
    const DEFAULT_AVATAR = { face: "🐱", bg: "#ffd9a8", acc: "" };
    const Q_NEED = 10;
    const DB = {
      users: store.get("users", {}),
      session: store.get("session", null),
      guest: store.get("guest", null) || { mine: store.get("mine", []), best: store.get("best", 0), total: store.get("total", 0) }
    };
    if (DB.session && !DB.users[DB.session]) DB.session = null;
    const save = () => { store.set("users", DB.users); store.set("session", DB.session); store.set("guest", DB.guest); };
    const loggedIn = () => !!DB.session;
    const me = () => (DB.session ? DB.users[DB.session] : DB.guest);
    const myWords = () => me().mine.filter(id => byId[id]);
    const hasMine = id => me().mine.includes(id);
    function toggleMine(id) {
      const m = me(), i = m.mine.indexOf(id);
      if (i >= 0) m.mine.splice(i, 1); else m.mine.push(id);
      save(); return i < 0;
    }

    /* ---------- 비밀번호 해시 (PBKDF2) ---------- */
    const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    async function hashPw(pw, salt) {
      if (!(window.crypto && crypto.subtle)) throw new Error("nocrypto");
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: new TextEncoder().encode(salt), iterations: 100000, hash: "SHA-256" }, key, 256);
      return toHex(bits);
    }
    const newSalt = () => toHex(crypto.getRandomValues(new Uint8Array(16)));

    /* ---------- 소리 ---------- */
    let zhVoice = null;
    function pickVoice() {
      if (!window.speechSynthesis) return;
      const vs = speechSynthesis.getVoices();
      zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
    }
    if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
    function speak(text) {
      if (!window.speechSynthesis) { toast("이 브라우저는 소리를 지원하지 않아요"); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/…/g, " "));
      u.lang = "zh-CN"; u.rate = 0.85;
      if (zhVoice) u.voice = zhVoice;
      speechSynthesis.speak(u);
    }
    let toastTimer;
    function toast(msg) {
      const t = $("#toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
    }

    /* ---------- 모달 ---------- */
    function openModal(html) {
      $("#modalBody").innerHTML = html; $("#modal").classList.add("open"); $(".sheet").scrollTop = 0;
      addPwToggles($("#modalBody"));
    }
    // 비밀번호 칸마다 '보기/숨기기' 버튼 붙이기
    function addPwToggles(root) {
      root.querySelectorAll('input[type="password"]').forEach(inp => {
        // 보기 상태(text)에서도 폰이 첫 글자를 대문자로 바꾸거나 자동수정하지 않게
        inp.setAttribute("autocapitalize", "off"); inp.setAttribute("autocorrect", "off"); inp.setAttribute("spellcheck", "false");
        const wrap = document.createElement("div");
        wrap.className = "pwwrap";
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        const b = document.createElement("button");
        b.type = "button"; b.className = "pwtoggle"; b.textContent = "👁 보기";
        b.setAttribute("aria-label", "비밀번호 보기");
        b.onclick = () => {
          const show = inp.type === "password";
          inp.type = show ? "text" : "password";
          b.textContent = show ? "🙈 숨기기" : "👁 보기";
          b.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
          inp.focus();
        };
        wrap.appendChild(b);
      });
    }
    function closeModal() { $("#modal").classList.remove("open"); }
    $("#modalX").onclick = closeModal;
    $("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

    /* ---------- 아바타 ---------- */
    // need = 이 아바타를 쓰려면 필요한 누적 점수
    const FACES = [
      ["🐱", 0], ["🐶", 0], ["🐭", 0], ["🐹", 0], ["😀", 0],
      ["🐰", 100], ["🐻", 100], ["🐼", 100], ["🐥", 100],
      ["🦊", 200], ["🐨", 200], ["🐯", 200], ["😎", 200],
      ["🐸", 300], ["🐵", 300], ["🐧", 300], ["🐢", 300],
      ["🥳", 400], ["🐷", 500], ["🐮", 500], ["🦁", 500], ["🐔", 500], ["🦉", 500],
      ["🤓", 600], ["🦄", 700], ["🐙", 700], ["🦋", 700], ["🐲", 1000], ["🐳", 1000]
    ].map(([e, need]) => ({ e, need }));
    const BGS = ["#ffd9a8", "#ffc9c9", "#ffe9a3", "#c9f0d3", "#c4e3ff", "#dccaff", "#ffd0ec", "#e3e3e3"];
    const ACCS = [
      { e: "", pos: "", need: 0 }, { e: "🎀", pos: "top", need: 0 }, { e: "🌸", pos: "top", need: 100 },
      { e: "🎧", pos: "top", need: 200 }, { e: "🕶️", pos: "eyes", need: 300 },
      { e: "🎩", pos: "top", need: 500 }, { e: "👑", pos: "top", need: 1000 }
    ];
    const isOpen = (item, total) => total >= item.need;
    const unlockedKeys = total => [...FACES, ...ACCS].filter(x => x.e && isOpen(x, total)).map(x => x.e);
    function avatarHtml(a, size = 44) {
      a = a || DEFAULT_AVATAR;
      const acc = ACCS.find(x => x.e === a.acc);
      return `<span class="avatar" style="width:${size}px;height:${size}px;background:${a.bg};font-size:${Math.round(size * 0.58)}px">` +
        `<span>${a.face}</span>` +
        (acc && acc.e ? `<span class="acc ${acc.pos}" style="font-size:${Math.round(size * 0.42)}px">${acc.e}</span>` : "") + `</span>`;
    }

    /* ---------- 상단 바 ---------- */
    function renderHeader() {
      const u = loggedIn() ? me() : null;
      $("#profileBtn").innerHTML = (u ? avatarHtml(u.avatar, 24) : "👤") + " 프로필";
      $("#authBtn").textContent = u ? "로그아웃" : "로그인";
      $("#sub").textContent = u ? `${DB.session}님, 환영해요!` : "新 HSK 1~3급 단어 600개";
    }
    $("#authBtn").onclick = () => {
      if (loggedIn()) { DB.session = null; save(); refreshAll(); toast("로그아웃했어요"); }
      else openAuth("login");
    };
    $("#profileBtn").onclick = openFriendList;

    /* ================= 로그인 / 회원가입 ================= */
    function openAuth(mode) {
      const isLogin = mode === "login";
      openModal(`
        <h2>${isLogin ? "🔑 로그인" : "📝 회원가입"}</h2>
        <form id="authForm" autocomplete="off">
          <label class="field">아이디
            <input id="aId" maxlength="12" autocapitalize="off" spellcheck="false" placeholder="아이디">
            ${isLogin ? "" : "<small>영문 소문자·숫자·_ 로 3~12자</small>"}
          </label>
          <label class="field">비밀번호
            <input id="aPw" type="password" placeholder="비밀번호">
            ${isLogin ? "" : "<small>4자 이상</small>"}
          </label>
          ${isLogin ? "" : `<label class="field">비밀번호 확인<input id="aPw2" type="password" placeholder="비밀번호 다시 입력"></label>`}
          <div class="err" id="aErr"></div>
          <button class="btn full" type="submit">${isLogin ? "로그인" : "가입하기"}</button>
        </form>
        ${isLogin ? `<p class="note">ℹ️ 계정은 가입한 <b>브라우저·기기</b>에만 저장돼요. 다른 기기에서는 새로 가입해야 해요.</p>` : ""}
        <div class="switch">
          ${isLogin ? "아직 계정이 없나요?" : "이미 계정이 있나요?"}
          <button class="btn ghost full" id="switchBtn">${isLogin ? "회원가입" : "로그인으로 돌아가기"}</button>
        </div>`);
      $("#switchBtn").onclick = () => openAuth(isLogin ? "signup" : "login");
      $("#authForm").onsubmit = e => { e.preventDefault(); (isLogin ? doLogin : doSignup)(); };
      setTimeout(() => $("#aId").focus(), 50);
    }
    const setErr = m => { $("#aErr").textContent = m; };

    async function doLogin() {
      const id = $("#aId").value.trim().toLowerCase(), pw = $("#aPw").value;
      if (!id || !pw) return setErr("아이디와 비밀번호를 입력해 주세요.");
      const u = DB.users[id];
      if (!u) {
        const n = Object.keys(DB.users).length;
        return setErr(`'${id}' 아이디가 이 브라우저에 없어요. 계정은 가입한 브라우저·주소에만 저장돼요. ` +
          (n ? `(여기에 가입된 계정: ${n}개)` : "(여기에는 가입된 계정이 아직 없어요)"));
      }
      try {
        if ((await hashPw(pw, u.salt)) !== u.hash) return setErr("비밀번호가 맞지 않아요. 대문자·소문자와 띄어쓰기를 확인해 보세요. (👁 보기로 확인할 수 있어요)");
      } catch (e) { return setErr("이 환경에서는 로그인을 할 수 없어요."); }
      DB.session = id; save(); closeModal(); refreshAll(); toast(`${id}님, 환영해요! 👋`);
    }

    async function doSignup() {
      const id = $("#aId").value.trim().toLowerCase(), pw = $("#aPw").value, pw2 = $("#aPw2").value;
      if (!/^[a-z0-9_]{3,12}$/.test(id)) return setErr("아이디는 영문 소문자·숫자·_ 로 3~12자예요.");
      if (pw.length < 4) return setErr("비밀번호는 4자 이상이어야 해요.");
      if (pw !== pw2) return setErr("비밀번호 확인이 일치하지 않아요.");
      if (DB.users[id]) return setErr("이미 사용 중인 아이디예요.");
      let salt, hash;
      try { salt = newSalt(); hash = await hashPw(pw, salt); }
      catch (e) { return setErr("이 환경에서는 회원가입을 할 수 없어요."); }
      const g = DB.guest;
      DB.users[id] = {
        salt, hash, avatar: { ...DEFAULT_AVATAR }, friends: [],
        mine: [...g.mine], best: g.best, total: g.total, created: Date.now()
      };
      const imported = g.mine.length > 0;
      DB.guest = { mine: [], best: 0, total: 0 };   // 한 번 가져간 게스트 기록은 비움
      DB.session = id; save(); closeModal(); refreshAll();
      toast(imported ?"가입 완료! 저장해 둔 단어도 가져왔어요 🎉" : "가입 완료! 환영해요 🎉");
    }

    /* ================= 친구 목록 (프로필 버튼) + 아바타 꾸미기 ================= */
    function needLoginHtml(msg) {
      return `<div class="empty"><div class="big">🔒</div>${msg}<br><button class="btn" id="needLogin">로그인 하기</button></div>`;
    }
    function bindNeedLogin() { const b = $("#needLogin"); if (b) b.onclick = () => openAuth("login"); }

    function openFriendList() {
      if (!loggedIn()) { openModal(`<h2>👥 친구 목록</h2>${needLoginHtml("로그인하면 친구 목록을 볼 수 있어요.")}`); bindNeedLogin(); return; }
      const u = me();
      const friends = u.friends.filter(f => DB.users[f]);
      openModal(`
        <h2>👥 친구 목록</h2>
        <div class="me-card">${avatarHtml(u.avatar, 52)}<div><b>${esc(DB.session)} (나)</b><small>최고 ${u.best}점 · 단어장 ${myWords().length}개</small></div></div>
        ${friends.length ? friends.map(f => { const x = DB.users[f]; return `
          <div class="person">${avatarHtml(x.avatar, 42)}
            <div class="who"><b>${esc(f)}</b><small>최고 ${x.best}점 · 누적 ${x.total}점</small></div>
            <button class="icon-btn del" data-f="${esc(f)}" title="친구 삭제">✕</button>
          </div>`; }).join("")
          : `<div class="empty"><div class="big">🫥</div>아직 친구가 없어요.<br>아래 <b>'친구 추가'</b> 버튼에서 아이디로 찾아보세요!</div>`}
        <div class="fab-row" style="justify-content:space-between;align-items:center">
          <button class="btn ghost" id="openPw">🔒 비밀번호 고치기</button>
          <button class="btn" id="openAvatar">🎨 프로필</button>
        </div>`);
      $("#openPw").onclick = () => openPwCheck();
      $("#modalBody").querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
        removeFriend(b.dataset.f); openFriendList(); toast("친구를 삭제했어요");
      });
      $("#openAvatar").onclick = openAvatarEditor;
    }

    function openAvatarEditor() {
      const u = me(), total = u.total;
      const draft = { ...(u.avatar || DEFAULT_AVATAR) };
      const nextNeed = [...FACES, ...ACCS].map(x => x.need).filter(n => n > total).sort((a, b) => a - b)[0];
      const itemBtn = x => {
        const open = isOpen(x, total);
        const label = x.e ? `<span style="font-size:1.5rem;line-height:1">${x.e}</span>` : `<span style="font-size:.75rem;font-weight:800;color:var(--muted)">없음</span>`;
        return `<button class="${open ? "" : "locked"}" data-v="${x.e}" data-need="${x.need}">${label}<span class="lk">${open ? "" : "🔒" + x.need}</span></button>`;
      };
      const draw = () => {
        $("#avPrev").innerHTML = avatarHtml(draft, 110);
        $("#faceGrid").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === draft.face));
        $("#bgGrid").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === draft.bg));
        $("#accGrid").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === draft.acc));
      };
      openModal(`
        <h2>🎨 프로필 꾸미기</h2>
        <div class="avatar-preview" id="avPrev"></div>
        <div class="unlock-info">⭐ 누적 점수 <b>${total}점</b>${nextNeed ? ` · 다음 아바타는 <b>${nextNeed}점</b>에 열려요 (${nextNeed - total}점 남음)` : " · 모든 아바타가 열렸어요! 🎉"}</div>
        <div class="opt-title">캐릭터</div>
        <div class="grid" id="faceGrid">${FACES.map(itemBtn).join("")}</div>
        <div class="opt-title">배경 색</div>
        <div class="grid" id="bgGrid">${BGS.map(c => `<button class="sw" data-v="${c}" style="background:${c}"></button>`).join("")}</div>
        <div class="opt-title">꾸미기</div>
        <div class="grid" id="accGrid">${ACCS.map(itemBtn).join("")}</div>
        <div class="row" style="margin-top:20px">
          <button class="btn ghost" id="avBack">← 친구 목록</button>
          <button class="btn" id="avSave">저장하기</button>
        </div>`);
      const pick = key => e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.classList.contains("locked")) { toast(`🔒 누적 ${b.dataset.need}점이 되면 열려요 (지금 ${total}점)`); return; }
        draft[key] = b.dataset.v; draw();
      };
      $("#faceGrid").onclick = pick("face");
      $("#bgGrid").onclick = pick("bg");
      $("#accGrid").onclick = pick("acc");
      $("#avBack").onclick = openFriendList;
      $("#avSave").onclick = () => {
        const f = FACES.find(x => x.e === draft.face), a = ACCS.find(x => x.e === draft.acc);
        if ((f && !isOpen(f, total)) || (a && !isOpen(a, total))) { toast("아직 잠겨 있는 아바타예요 🔒"); return; }
        u.avatar = draft; save(); renderHeader(); openFriendList(); toast("프로필을 저장했어요 ✨"); };
      draw();
    }

    /* ---------- 비밀번호 고치기: 1) 원래 비밀번호 확인 → 2) 새 비밀번호 입력 ---------- */
    function openPwCheck() {
      openModal(`
        <h2>🔒 비밀번호 고치기</h2>
        <form id="pwCheckForm" autocomplete="off">
          <label class="field">원래 비밀번호
            <input id="pOld" type="password" placeholder="지금 쓰는 비밀번호">
            <small>원래 비밀번호가 맞으면 새 비밀번호를 정하는 창이 열려요.</small>
          </label>
          <div class="err" id="pErr"></div>
          <button class="btn full" type="submit">확인</button>
          <button class="btn ghost full" type="button" id="pCancel" style="margin-top:8px">← 친구 목록</button>
        </form>`);
      $("#pCancel").onclick = openFriendList;
      $("#pwCheckForm").onsubmit = async e => {
        e.preventDefault();
        const pw = $("#pOld").value, u = me();
        if (!pw) { $("#pErr").textContent = "원래 비밀번호를 입력해 주세요."; return; }
        try {
          if ((await hashPw(pw, u.salt)) !== u.hash) { $("#pErr").textContent = "원래 비밀번호가 맞지 않아요."; return; }
        } catch (err) { $("#pErr").textContent = "이 환경에서는 비밀번호를 고칠 수 없어요."; return; }
        openPwNew();
      };
      setTimeout(() => $("#pOld").focus(), 50);
    }
    function openPwNew() {
      openModal(`
        <h2>🔑 새 비밀번호 정하기</h2>
        <form id="pwNewForm" autocomplete="off">
          <label class="field">새 비밀번호
            <input id="pNew" type="password" placeholder="새 비밀번호">
            <small>4자 이상</small>
          </label>
          <label class="field">새 비밀번호 확인<input id="pNew2" type="password" placeholder="새 비밀번호 다시 입력"></label>
          <div class="err" id="pErr"></div>
          <button class="btn full" type="submit">비밀번호 바꾸기</button>
        </form>`);
      $("#pwNewForm").onsubmit = async e => {
        e.preventDefault();
        const a = $("#pNew").value, b = $("#pNew2").value, u = me();
        if (a.length < 4) { $("#pErr").textContent = "새 비밀번호는 4자 이상이어야 해요."; return; }
        if (a !== b) { $("#pErr").textContent = "새 비밀번호 확인이 일치하지 않아요."; return; }
        try {
          if ((await hashPw(a, u.salt)) === u.hash) { $("#pErr").textContent = "원래 비밀번호와 같아요. 다른 비밀번호를 정해 주세요."; return; }
          const salt = newSalt(); u.hash = await hashPw(a, salt); u.salt = salt;
        } catch (err) { $("#pErr").textContent = "이 환경에서는 비밀번호를 고칠 수 없어요."; return; }
        save(); openFriendList(); toast("비밀번호를 바꿨어요 🔒");
      };
      setTimeout(() => $("#pNew").focus(), 50);
    }

    function removeFriend(fid) {
      const u = me(); u.friends = u.friends.filter(x => x !== fid);
      const o = DB.users[fid]; if (o) o.friends = o.friends.filter(x => x !== DB.session);
      save();
    }
    function addFriend(fid) {
      const u = me(), o = DB.users[fid];
      if (!o || fid === DB.session || u.friends.includes(fid)) return;
      u.friends.push(fid); if (!o.friends.includes(DB.session)) o.friends.push(DB.session);
      save();
    }

    /* ================= 하단 메뉴 / 화면 전환 ================= */
    let currentView = "cards";
    function show(view) {
      currentView = view;
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + view));
      document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
      renderView();
      window.scrollTo(0, 0);
    }
    function renderView() {
      if (currentView === "mine") renderMine();
      else if (currentView === "quiz") renderQuizStart();
      else if (currentView === "add") renderAdd();
      else if (currentView === "league") renderLeague();
    }
    function refreshAll() { renderHeader(); updateMineUi(); renderView(); }
    document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.view));

    /* ================= 1. 플래시카드 ================= */
    const LV_NAMES = { 0: "전체", 1: "1급", 2: "2급", 3: "3급" };
    let level = store.get("level", 0);
    let order = [], idx = 0, isShuffled = false;

    function buildDeck(keepId) {
      let list = WORDS.filter(w => level === 0 || w.lv === level);
      if (isShuffled) list = shuffle(list);
      order = list.map(w => w.id);
      idx = keepId && order.includes(keepId) ? order.indexOf(keepId) : 0;
    }
    function renderChips() {
      $("#levelChips").innerHTML = [0, 1, 2, 3].map(l => `<button class="chip ${l === level ? "on" : ""}" data-l="${l}">${LV_NAMES[l]}</button>`).join("");
      document.querySelectorAll("#levelChips .chip").forEach(c => c.onclick = () => {
        level = +c.dataset.l; store.set("level", level); buildDeck(); renderChips(); renderCard();
      });
    }
    const cur = () => byId[order[idx]];
    function renderCard() {
      const w = cur();
      $("#card").classList.remove("flipped");
      $("#counter").textContent = `${idx + 1} / ${order.length}`;
      const hz = $("#hanzi"); hz.textContent = w.h; hz.classList.toggle("long", w.h.length > 3);
      const ko = $("#ko"); ko.textContent = w.k; ko.classList.toggle("long", w.k.length > 14);
      $("#py").textContent = w.p;
      $("#exZh").textContent = w.e; $("#exKo").textContent = w.t;
      $("#lvTagF").textContent = $("#lvTagB").textContent = w.lv + "급";
      updateMineUi();
      store.set("pos", w.id);
    }
    function updateMineUi() {
      const w = cur(), has = hasMine(w.id);
      $("#mineF").textContent = $("#mineB").textContent = has ? "⭐" : "";
      const b = $("#addMine");
      b.textContent = has ? "✓ 내 단어장에 있음 (빼기)" : "⭐ 내 단어장에 추가";
      b.className = has ? "btn gold" : "btn";
    }
    function flip() {
      const c = $("#card"); c.classList.toggle("flipped");
      if (c.classList.contains("flipped")) speak(cur().h);
    }
    function move(d) { idx = (idx + d + order.length) % order.length; renderCard(); }
    $("#card").onclick = e => { if (e.target.closest("button")) return; flip(); };
    $("#speakEx").onclick = e => { e.stopPropagation(); speak(cur().e); };
    $("#speakWord").onclick = () => speak(cur().h);
    $("#prev").onclick = () => move(-1);
    $("#next").onclick = () => move(1);
    $("#shuffle").onclick = () => {
      isShuffled = !isShuffled; buildDeck(cur().id);
      $("#shuffle").textContent = isShuffled ? "🔀 섞는 중" : "🔀 섞기";
      renderCard(); toast(isShuffled ? "단어를 섞었어요" : "원래 순서로 돌아왔어요");
    };
    $("#addMine").onclick = () => {
      const w = cur();
      toast(toggleMine(w.id) ? `'${w.h}' 를 내 단어장에 추가했어요 ⭐` : `'${w.h}' 를 내 단어장에서 뺐어요`);
      updateMineUi();
    };
    document.addEventListener("keydown", e => {
      if (currentView !== "cards" || $("#modal").classList.contains("open")) return;
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") move(1);
      else if (e.key === "ArrowLeft") move(-1);
      else if (e.key === " ") { e.preventDefault(); flip(); }
    });

    /* ================= 2. 내 단어장 ================= */
    function renderMine() {
      const list = myWords().map(id => byId[id]);
      $("#mineCount").textContent = `${list.length}개`;
      const box = $("#mineList");
      if (!list.length) {
        box.innerHTML = `<div class="empty"><div class="big">📭</div>아직 저장한 단어가 없어요.<br>플래시카드에서 외운 단어를<br><b>'내 단어장에 추가'</b> 해 보세요!</div>`;
        return;
      }
      box.innerHTML = list.map(w => `
        <div class="item" data-id="${w.id}">
          <div class="top">
            <div class="h">${w.h}</div>
            <div class="m"><div class="p">${w.p}</div><div class="k">${w.k}</div></div>
            <button class="icon-btn" data-a="say" title="발음">🔊</button>
            <button class="icon-btn del" data-a="del" title="빼기">✕</button>
          </div>
          <div class="ex"><span>${w.e}</span><small>${w.t}</small></div>
        </div>`).join("");
      box.querySelectorAll(".item").forEach(el => {
        const w = byId[el.dataset.id];
        el.querySelector('[data-a="say"]').onclick = () => speak(w.h);
        el.querySelector(".ex").onclick = () => speak(w.e);
        el.querySelector('[data-a="del"]').onclick = () => { toggleMine(w.id); renderMine(); updateMineUi(); toast(`'${w.h}' 를 뺐어요`); };
      });
    }

    /* ================= 3. 퀴즈 (단어장 10개 이상일 때만) ================= */
    let quiz = null;
    function renderQuizStart() {
      const n = myWords().length, u = me();
      const ok = n >= Q_NEED;
      $("#quizBox").innerHTML = `
        <div class="panel">
          <h2>📝 단어 퀴즈</h2>
          <p>내 단어장의 단어 <b>${Q_NEED}개</b>로 문제를 내요.<br>한자를 보고 알맞은 뜻을 고르세요!<br>정답 1개당 <b>10점</b>이에요.</p>
          <div class="stats">
            <div class="stat"><b>${n}</b><span>내 단어장</span></div>
            <div class="stat"><b>${u.best}</b><span>최고 점수</span></div>
            <div class="stat"><b>${u.total}</b><span>누적 점수</span></div>
          </div>
          ${ok
            ? `<button class="btn full" id="startQuiz">퀴즈 시작! (${Q_NEED}문제)</button>`
            : `<div class="lockmsg">퀴즈를 풀려면 단어를 10개 이상 외우고 내 단어장에 추가해주세요!<br><span style="font-weight:600">(지금 ${n}개 · ${Q_NEED - n}개 더 필요해요)</span></div>
               <button class="btn full" id="startQuiz" disabled>🔒 퀴즈 시작</button>
               <button class="btn ghost full" id="goCards" style="margin-top:8px">🃏 플래시카드로 가기</button>`}
        </div>`;
      if (ok) $("#startQuiz").onclick = startQuiz;
      else $("#goCards").onclick = () => show("cards");
    }
    function startQuiz() {
      if (myWords().length < Q_NEED) { renderQuizStart(); return; }
      const picked = shuffle(myWords().map(id => byId[id])).slice(0, Q_NEED);
      quiz = {
        i: 0, score: 0, wrong: [], answered: false,
        qs: picked.map(w => {
          const others = shuffle(WORDS.filter(o => o.k !== w.k)).slice(0, 3).map(o => o.k);
          return { w, choices: shuffle([w.k, ...others]) };
        })
      };
      renderQuestion();
    }
    function renderQuestion() {
      const { qs, i } = quiz, q = qs[i], w = q.w;
      quiz.answered = false;
      $("#quizBox").innerHTML = `
        <div class="panel">
          <div class="qmeta"><span>문제 ${i + 1} / ${qs.length}</span><span>점수 ${quiz.score}</span></div>
          <div class="progress"><div style="width:${(i / qs.length) * 100}%"></div></div>
          <div class="qword"><div class="hanzi ${w.h.length > 3 ? "long" : ""}">${w.h}</div><div class="py">${w.p}</div></div>
          <button class="speak" id="qSpeak" style="margin-top:8px">🔊 듣기</button>
          <div class="choices">${q.choices.map((c, n) => `<button class="choice" data-n="${n}">${c}</button>`).join("")}</div>
          <div class="feedback" id="fb"></div>
          <button class="btn full" id="nextQ" style="display:none;margin-top:8px"></button>
        </div>`;
      $("#qSpeak").onclick = () => speak(w.h);
      document.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(b));
    }
    function answer(btn) {
      if (quiz.answered) return;
      quiz.answered = true;
      const q = quiz.qs[quiz.i], ok = q.choices[+btn.dataset.n] === q.w.k;
      document.querySelectorAll(".choice").forEach(b => { b.disabled = true; if (q.choices[+b.dataset.n] === q.w.k) b.classList.add("right"); });
      const fb = $("#fb");
      if (ok) { quiz.score += 10; fb.textContent = "정답! 🎉 +10점"; fb.className = "feedback ok"; }
      else { btn.classList.add("wrong"); quiz.wrong.push(q.w); fb.textContent = "아쉬워요 😢 정답은 초록색이에요"; fb.className = "feedback no"; }
      speak(q.w.h);
      const last = quiz.i === quiz.qs.length - 1, nb = $("#nextQ");
      nb.style.display = "block"; nb.textContent = last ? "결과 보기 🏁" : "다음 문제 ▶";
      nb.onclick = () => { if (last) finishQuiz(); else { quiz.i++; renderQuestion(); } };
    }
    function finishQuiz() {
      const { score, qs, wrong } = quiz, u = me();
      const newBest = score > u.best;
      const before = unlockedKeys(u.total);
      if (newBest) u.best = score;
      u.total += score; save();
      const fresh = unlockedKeys(u.total).filter(k => !before.includes(k));
      const max = qs.length * 10;
      const msg = score === max ? "완벽해요! 🏆" : score >= max * 0.7 ? "잘했어요! 👏" : "조금만 더 연습해요 💪";
      $("#quizBox").innerHTML = `
        <div class="panel">
          <h2>${msg}</h2>
          <div class="score-big">${score}<small> / ${max}점</small></div>
          <p style="margin-top:6px">${newBest ? "🎖 최고 점수를 새로 세웠어요!" : `최고 점수 ${u.best}점`}<br>누적 점수 ${u.total}점
            ${loggedIn() ? "" : "<br><small>로그인하면 친구 리그에서 점수를 겨룰 수 있어요!</small>"}</p>
          ${fresh.length ? `<div class="lockmsg" style="background:#eaf7ee;border-color:var(--good);color:#1f6b3d">🎉 새 아바타가 열렸어요!<br><span style="font-size:1.8rem">${fresh.join(" ")}</span><br><small>${loggedIn() ? "프로필 → 🎨 프로필에서 꾸며 보세요" : "로그인하면 프로필을 꾸밀 수 있어요"}</small></div>` : ""}
          ${wrong.length ? `<div class="wrongs"><h3>다시 볼 단어</h3>${wrong.map(w => `<div><b>${w.h}</b> ${w.p} — ${w.k}</div>`).join("")}</div>` : ""}
          <div class="row">
            <button class="btn ghost" id="toLeague">🏆 친구 리그</button>
            <button class="btn" id="again">🔁 다시 풀기</button>
          </div>
        </div>`;
      $("#again").onclick = startQuiz;
      $("#toLeague").onclick = () => show("league");
    }

    /* ================= 4. 친구 추가 ================= */
    let lastQuery = "";
    function renderAdd() {
      const box = $("#addBox");
      if (!loggedIn()) { box.innerHTML = needLoginHtml("로그인해야 친구를 추가할 수 있어요."); bindNeedLogin(); return; }
      box.innerHTML = `
        <form class="searchbar" id="searchForm">
          <input id="q" placeholder="친구 아이디를 검색하세요" maxlength="12" autocapitalize="off" spellcheck="false" value="${esc(lastQuery)}">
          <button class="btn" type="submit">검색</button>
        </form>
        <div id="results"></div>`;
      $("#searchForm").onsubmit = e => { e.preventDefault(); lastQuery = $("#q").value.trim().toLowerCase(); drawResults(); };
      drawResults();
    }
    function drawResults() {
      const out = $("#results");
      if (!lastQuery) { out.innerHTML = `<div class="empty"><div class="big">🔍</div>친구의 아이디를 입력하고<br>검색해 보세요!</div>`; return; }
      const u = me();
      const found = Object.keys(DB.users).filter(id => id !== DB.session && id.includes(lastQuery))
        .sort((a, b) => (b === lastQuery) - (a === lastQuery) || a.localeCompare(b)).slice(0, 10);
      if (!found.length) {
        out.innerHTML = `<div class="empty"><div class="big">🤔</div>'${esc(lastQuery)}' 아이디를 가진 사람을 찾지 못했어요.<br><small>이 앱은 지금 이 브라우저에 가입한 사람만 찾을 수 있어요.</small></div>`;
        return;
      }
      out.innerHTML = found.map(id => { const x = DB.users[id], isF = u.friends.includes(id); return `
        <div class="person">${avatarHtml(x.avatar, 44)}
          <div class="who"><b>${esc(id)}</b><small>최고 ${x.best}점 · 누적 ${x.total}점</small></div>
          ${isF ? `<button class="btn small ghost" disabled>✓ 친구</button>` : `<button class="btn small" data-add="${esc(id)}">친구 추가</button>`}
        </div>`; }).join("");
      out.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { addFriend(b.dataset.add); toast(`${b.dataset.add}님을 친구로 추가했어요 🎉`); drawResults(); });
    }

    /* ================= 5. 친구 리그 ================= */
    let leagueBy = "best";
    function renderLeague() {
      const box = $("#leagueBox");
      if (!loggedIn()) { box.innerHTML = needLoginHtml("로그인하면 친구들과 퀴즈 점수를 겨룰 수 있어요."); bindNeedLogin(); return; }
      const u = me();
      const friends = u.friends.filter(f => DB.users[f]);
      if (!friends.length) {
        box.innerHTML = `<div class="empty"><div class="big">🏟️</div>리그에 참가할 친구가 아직 없어요.<br>친구를 추가하면 점수 순위가 나타나요!<br><button class="btn" id="goAdd">➕ 친구 추가하러 가기</button></div>`;
        $("#goAdd").onclick = () => show("add"); return;
      }
      const rows = [DB.session, ...friends].map(id => ({ id, ...DB.users[id] }));
      const key = leagueBy, other = key === "best" ? "total" : "best";
      rows.sort((a, b) => b[key] - a[key] || b[other] - a[other] || a.id.localeCompare(b.id));
      const myRank = rows.findIndex(r => r.id === DB.session) + 1;
      const medal = n => ["🥇", "🥈", "🥉"][n - 1] || n;
      box.innerHTML = `
        <div class="chips">
          <button class="chip ${key === "best" ? "on" : ""}" data-by="best">최고 점수 순</button>
          <button class="chip ${key === "total" ? "on" : ""}" data-by="total">누적 점수 순</button>
        </div>
        <div class="counter">내 순위 <b>${myRank}위</b> / ${rows.length}명</div>
        ${rows.map((r, i) => `
          <div class="person ${r.id === DB.session ? "me" : ""}">
            <div class="rank">${medal(i + 1)}</div>${avatarHtml(r.avatar, 42)}
            <div class="who"><b>${esc(r.id)}${r.id === DB.session ? " (나)" : ""}</b></div>
            <div class="pts">${r[key]}점<small>${key === "best" ? "누적" : "최고"} ${r[other]}점</small></div>
          </div>`).join("")}
        <p class="counter" style="margin-top:10px">퀴즈를 풀면 점수가 올라가요! 📝</p>`;
      box.querySelectorAll("[data-by]").forEach(b => b.onclick = () => { leagueBy = b.dataset.by; renderLeague(); });
    }

    /* ================= 시작 ================= */
    buildDeck(store.get("pos", null));
    renderChips();
    renderCard();
    renderHeader();
  </script>
</body>
</html>
